# ============================================================
# ModNVote 2.0 Configuration
# ============================================================
# This is the new clean-break configuration for ModNVote 2.x.
# Existing 1.x data/config installations should not be reused.
# ============================================================

general:
  debug: false

storage:
  sqlite_file: "modnvote.db"

publication:
  # External witness publication targets.
  #
  # Leave this as [] to disable webhook publication:
  # discord_webhooks: []
  #
  # To enable Discord publication, change it to a YAML list:
  # discord_webhooks:
  #   - "https://discord.com/api/webhooks/WEBHOOK_ID/WEBHOOK_TOKEN"
  #
  # Multiple webhooks are supported:
  # discord_webhooks:
  #   - "https://discord.com/api/webhooks/FIRST_WEBHOOK_ID/FIRST_WEBHOOK_TOKEN"
  #   - "https://discord.com/api/webhooks/SECOND_WEBHOOK_ID/SECOND_WEBHOOK_TOKEN"
  #
  # Never commit real webhook URLs to source control.
  discord_webhooks: []
  publish_poll_opened: true
  # Controls ALL closed-poll result publication: yes/no, ranked single-winner, and
  # linked-offices elections all publish their closed result through this one flag
  # (on close and on /modnvote publishresult). Set to false to suppress every
  # closed-result witness embed regardless of poll type.
  publish_poll_closed: true
  publish_checkpoints: true

integrity:
  # Automatic witness checkpoints are published every N accepted ballots
  # when publication.publish_checkpoints is true and at least one webhook is configured.
  #
  # Set to 0 or a negative number to disable automatic interval checkpoints.
  checkpoint_interval_ballots: 25
  canonicalization_version: 1

ui:
  require_confirmation: true

  sounds:
    enabled: false

    selection_assigned:
      sound: "UI_BUTTON_CLICK"
      volume: 0.8
      pitch: 1.2

    selection_removed:
      sound: "UI_BUTTON_CLICK"
      volume: 0.8
      pitch: 0.8

    reset:
      sound: "UI_BUTTON_CLICK"
      volume: 0.9
      pitch: 0.6

    review_advance:
      sound: "UI_BUTTON_CLICK"
      volume: 0.9
      pitch: 1.0

    return_to_selection:
      sound: "UI_BUTTON_CLICK"
      volume: 0.9
      pitch: 0.85

    submit_success:
      sound: "ENTITY_EXPERIENCE_ORB_PICKUP"
      volume: 1.0
      pitch: 1.1

    submit_failure:
      sound: "ENTITY_VILLAGER_NO"
      volume: 0.9
      pitch: 1.0

messages:
  prefix: "&6[ModNVote] "
permissions:
  # Grant this node only where you intentionally want a player to bypass
  # IP-based duplicate prevention, such as approved same-household cases.
  bypass_node: "modnvote.bypass"
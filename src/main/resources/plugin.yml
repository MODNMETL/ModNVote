name: ModNVote
version: "${version}"
main: com.modnmetl.modnvote.ModNVotePlugin
api-version: "1.21"
author: MODN METL LTD
website: https://modnmetl.com
description: ModNVote 2.0 - secure poll and election platform

commands:
  modnvote:
    description: ModNVote 2.0 root command
    aliases:
      - poll
    usage: "/modnvote <status|reload|list|create|clone|checkpoint|show|option|validate|ready|open|close|result|mypolls|verify|vote|testvote>"
    permission: modnvote.use

permissions:
  modnvote.*:
    description: Full access to ModNVote 2.0
    default: op
    children:
      modnvote.use: true
      modnvote.admin.reload: true
      modnvote.admin.poll.list: true
      modnvote.admin.poll.create: true
      modnvote.admin.poll.open: true
      modnvote.admin.poll.close: true
      modnvote.verify: true
      modnvote.testvote: true

  modnvote.use:
    description: Allow use of base ModNVote command
    default: true

  modnvote.verify:
    description: Allow players to verify their vote inclusion and poll audit validity
    default: true

  modnvote.admin.reload:
    description: Allow reloading ModNVote configuration
    default: op

  modnvote.admin.poll.list:
    description: Allow listing stored polls
    default: op

  modnvote.admin.poll.create:
    description: Allow creating and editing polls
    default: op

  modnvote.admin.poll.open:
    description: Allow opening stored polls
    default: op

  modnvote.admin.poll.close:
    description: Allow closing open polls
    default: op

  modnvote.testvote:
    description: Allows test vote submission
    default: op

  modnvote.bypass:
    description: Allows bypass of IP-based duplicate prevention
    default: false